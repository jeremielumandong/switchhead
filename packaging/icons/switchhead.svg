<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- switchhead app icon: two branches join into one line (the site's git-fork mark).
       Source of truth for 48 px and up; generate.py renders the PNG / ICO / ICNS set from
       this file and from switchhead-small.svg (16-32 px). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24242B"/>
      <stop offset="1" stop-color="#111114"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.03"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect x="6" y="6" width="1012" height="1012" rx="222" fill="none" stroke="url(#rim)" stroke-width="12"/>
  <!-- The glyph on a 48-unit grid (as on the site), scaled to the tile. -->
  <g transform="translate(176 176) scale(14)" fill="none" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M24 22v11" stroke="#5AA3EC"/>
    <path d="M12 15v4a3 3 0 0 0 3 3h9" stroke="#BD9FF2"/>
    <path d="M36 15v4a3 3 0 0 1-3 3h-9" stroke="#4FC9B0"/>
    <g fill="#141418">
      <circle cx="12" cy="10" r="5" stroke="#BD9FF2"/>
      <circle cx="36" cy="10" r="5" stroke="#4FC9B0"/>
      <circle cx="24" cy="38" r="5" stroke="#5AA3EC"/>
    </g>
  </g>
</svg>

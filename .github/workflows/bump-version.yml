name: Bump version

# Bumps the workspace version on a new branch and opens a pull request (the same workflow as
# Switchyard's, plus the automatic trigger).
#
# - Every push to main bumps the patch version, unless that push already changed the version
#   (a merged bump PR, or a PR that bumped it by hand) or a bump PR is already open (it will
#   carry the next version; merging it covers every change merged before it).
# - Run it by hand for a minor or major bump, or an exact version.
#
# It never pushes to main: a commit pushed with GITHUB_TOKEN triggers no workflows, and the
# release workflows require a push-event CI run on main for the exact commit, which merging
# the bump PR provides. Opening the PR needs "Allow GitHub Actions to create and approve pull
# requests" (Settings > Actions > General); without it the run pushes the branch and links to
# open the PR by hand.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Which part to bump
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: Or an exact version (MAJOR.MINOR.PATCH); overrides the choice above
        type: string
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bump-version
  cancel-in-progress: false

jobs:
  bump:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          run=true
          if [ "$EVENT" = push ]; then
            version_at() {
              git show "$1:Cargo.toml" | python3 -c 'import sys,tomllib; print(tomllib.loads(sys.stdin.read())["workspace"]["package"]["version"])'
            }
            if git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
              && [ "$(version_at "$BEFORE")" != "$(version_at HEAD)" ]; then
              echo "This push changed the version ($(version_at "$BEFORE") -> $(version_at HEAD)); nothing to bump."
              run=false
            elif [ -n "$(gh pr list --base main --state open --json headRefName --jq '.[].headRefName | select(startswith("bump/v"))')" ]; then
              echo "A bump pull request is already open; it covers this push."
              run=false
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@1.98.1
        if: steps.decide.outputs.run == 'true'
      - name: Bump
        id: bump
        if: steps.decide.outputs.run == 'true'
        env:
          BUMP: ${{ inputs.version != '' && inputs.version || inputs.bump || 'patch' }}
        run: |
          old=$(python3 scripts/bump-version.py --current)
          new=$(python3 scripts/bump-version.py "$BUMP" | tail -n1)
          echo "old=$old" >> "$GITHUB_OUTPUT"
          echo "new=$new" >> "$GITHUB_OUTPUT"
      - name: Open the pull request
        if: steps.decide.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OLD: ${{ steps.bump.outputs.old }}
          NEW: ${{ steps.bump.outputs.new }}
        run: |
          branch="bump/v$NEW"
          compare="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/pull/new/$branch"
          if [ -n "$(gh pr list --head "$branch" --state open --json url --jq '.[].url')" ]; then
            echo "::error::A pull request for $branch is already open."
            exit 1
          fi
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            # Left by an earlier run whose pull request could not be opened: reuse it if it
            # holds this version.
            git fetch --depth 1 origin "$branch"
            if [ "$(git show FETCH_HEAD:Cargo.toml | python3 -c 'import sys,tomllib; print(tomllib.loads(sys.stdin.read())["workspace"]["package"]["version"])')" != "$NEW" ]; then
              echo "::error::Branch $branch exists with another version; delete it first."
              exit 1
            fi
            echo "Reusing the existing $branch."
          else
            # The repository's commits are all authored by its owner.
            git config user.name 'Jeremie Lumandong'
            git config user.email 'jeremie.lumandong@outlook.com'
            git switch -c "$branch"
            git add Cargo.toml Cargo.lock
            git commit -m "Bump version to $NEW"
            git push origin "$branch"
          fi
          if ! gh pr create --base main --head "$branch" --title "Bump version to $NEW" \
            --body "Bumps the workspace version from $OLD to $NEW (\`scripts/bump-version.py\`). Merge, wait for CI on main, then run the release workflows."; then
            # Usually "GitHub Actions is not permitted to create or approve pull requests".
            echo "::warning::Could not open the pull request. Open it here: $compare (or allow Actions to create pull requests in Settings > Actions > General and re-run)."
            echo "Open the pull request: $compare" >> "$GITHUB_STEP_SUMMARY"
          fi

name: Website

# Publishes site/ to GitHub Pages. Runs only when started by hand (Actions → Website →
# Run workflow); pushes to main do not deploy. Screenshots and fonts are copied in from
# docs/screenshots and crates/app/assets/fonts, so the README, the app and the site
# share one copy.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site/fonts
          cp -r site/. _site/
          cp -r docs/screenshots _site/screenshots
          cp crates/app/assets/fonts/*.ttf crates/app/assets/fonts/OFL-Geist.txt _site/fonts/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

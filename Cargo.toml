[workspace]
resolver = "3"
members = ["crates/git", "crates/hosting", "crates/agents", "crates/mcp", "crates/app"]
exclude = ["vendor/gpui-base", "vendor/gpui-fast"]
default-members = ["crates/git", "crates/hosting", "crates/agents", "crates/mcp", "crates/app"]

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/jeremielumandong/switchhead"
rust-version = "1.97"

[workspace.dependencies]
# internal
switchhead-git = { path = "crates/git" }
switchhead-hosting = { path = "crates/hosting" }
switchhead-mcp = { path = "crates/mcp" }
switchhead-agents = { path = "crates/agents" }

# UI: GPUI Kit 0.7.3 (gpui-pre 0.3.9 snapshot names + gpui-component 0.7.3, kept in
# lockstep), on the application-patched GPUI Fast stack below. See docs/DECISIONS.md.
gpui-kit = { version = "=0.7.3", features = ["tree-sitter-languages"] }

# Git reads (log, refs, status, diff). Writes go through the system `git` binary.
gix = { version = "0.89", default-features = false, features = [
    "max-performance-safe",
    "sha1",
    "basic",
    "status",
    "mailmap",
    "parallel",
] }

# Native file events (inotify / FSEvents / ReadDirectoryChangesW) for the work tree and
# `.git`; already in the tree through gpui-component. See docs/DECISIONS.md.
notify = "8.2"

# Channels from worker threads to the UI (the sync primitives only; no runtime).
tokio = { version = "1", default-features = false, features = ["sync"] }

# Hosting accounts: HTTPS to the GitHub / GitLab / Bitbucket / Azure DevOps APIs (rustls
# with ring and the system's roots, the stack gpui-kit's own reqwest fork already pulls
# in) and tokens in the OS keychain. See docs/DECISIONS.md.
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls-native-roots",
] }
keyring = "4.2"

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# errors / logs
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# platform
directories = "6"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }

# testing
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.dev]
# Keep debug builds snappy for the UI: optimize dependencies, not our crates.
opt-level = 0

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1

# GPUI Kit 0.7.3 on the application-patched GPUI Fast stack, the same vendored snapshot as
# AgentOpsChat. Local facades keep Kit, Component and Base on one native core; see
# vendor/gpui-fast/compat/README.md and docs/DECISIONS.md.
[patch.crates-io]
gpui-base = { path = "vendor/gpui-base" }
gpui-pre = { path = "vendor/gpui-fast/compat/gpui-pre" }
gpui-pre-platform = { path = "vendor/gpui-fast/compat/gpui-pre-platform" }
gpui-pre-macros = { path = "vendor/gpui-fast/compat/gpui-pre-macros" }
gpui-pre-sum-tree = { path = "vendor/gpui-fast/compat/gpui-pre-sum-tree" }
gpui-pre-web = { path = "vendor/gpui-fast/compat/gpui-pre-web" }

[patch."https://github.com/longbridge/gpui-fast"]
gpui = { path = "vendor/gpui-fast/crates/gpui" }
gpui_linux = { path = "vendor/gpui-fast/crates/gpui_linux" }
